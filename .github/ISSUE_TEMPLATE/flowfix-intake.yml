name: FlowFix 免费范围确认
description: 用脱敏信息确认流程是否适合自动化，以及对应套餐和交付边界
title: "[FlowFix 咨询] "
body:
  - type: markdown
    attributes:
      value: |
        此页面公开可见。只填写脱敏信息，不要上传真实业务文件、姓名、联系方式、账号、密码、密钥或其他敏感数据。提交后只进行范围判断，不代表已经下单。
  - type: dropdown
    id: package
    attributes:
      label: 希望确认的范围
      options:
        - starter_template - ¥299 可复用表格模板
        - single_workflow - ¥999 单流程实施
        - two_tool_workflow - ¥2499 两工具联动
        - 暂不确定，请根据流程建议
    validations:
      required: true
  - type: textarea
    id: current_process
    attributes:
      label: 当前人工步骤
      description: 只写操作步骤和脱敏字段名，不写真实数据。
      placeholder: 例如：每周导出订单 CSV，按商品编号匹配分类，再汇总数量和金额。
    validations:
      required: true
  - type: textarea
    id: expected_result
    attributes:
      label: 期望结果与验收方式
      description: 描述正确输出、必须拦截的异常和使用的软件版本。
      placeholder: 例如：生成商品汇总页；未匹配商品进入异常清单；可在 Excel 2021 打开。
    validations:
      required: true
  - type: textarea
    id: frequency
    attributes:
      label: 使用频率与大致数据量
      placeholder: 例如：每周一次，每次约 3000 行。
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 公开与隐私确认
      options:
        - label: 我确认这里是公开页面，并且没有提交任何真实业务数据、个人信息、账号或密码。
          required: true
